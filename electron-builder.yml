appId: app.reqwizit.desktop
productName: Reqwizit
directories:
  app: dist/desktop-app
  output: dist/installers
files:
  - app/**/*
  - web/**/*
  - assets/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
win:
  icon: assets/reqwizit.ico
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  installerIcon: assets/reqwizit.ico
  uninstallerIcon: assets/reqwizit.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
artifactName: Reqwizit-${version}-${arch}-setup.${ext}
